[package]
name = "zmc"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.1.5"
zr_protocol = { path="../zr_protocol" }
zirconium_mc_macros = { path="./zmc-macros" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
base64 = "0.22.1"
tokio = { version = "1.48.0", features = ["full"] }
clap = { version = "4.5.53", features = ["derive"] }
hex = "0.4.3"

[workspace]
members = ["zmc-macros/", "crates/*"]
